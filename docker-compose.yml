services:
  backend:
    image: iamlegend194/blog_app:${IMAGE_TAG} 
    container_name: my_backend
    restart: always
    ports:
      - "4001:4001"
    env_file:
      - .env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27016:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
