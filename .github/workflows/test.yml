name: Project_Testing

on:
  #schedule:
  #  - cron: 0 0 * * 4    
  workflow_dispatch: 
  pull_request:
    types: [opened]
    branches:
      - '/*/*'
      
permissions:
  contents: read
env:
  IMG_NAME: blog_app
  IMG_TAG: ${{ github.sha }}

  
jobs:
  Testing_phase:
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:  
        os: [ubuntu-latest,macos-latest,windows-latest]
        node: [22.x,23.x,24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set-Up NodeJs
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install Dependencies
        run: npm ci
      - name: Testing Section
        run: npm test
  Build_phase:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: Testing_phase
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Building Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:${{ env.IMG_TAG }} \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:latest .
      - name: Push Image to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:${{ env.IMG_TAG }}

  Deploy_phase:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: Build_phase
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Connecting to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:${{ env.IMG_TAG }}
            docker stop ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:${{ env.IMG_TAG }} || true
            docker rm ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:${{ env.IMG_TAG }} || true
            docker run -d \
            -p 3001:3001 \
            --name ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:${{ env.IMG_TAG }} \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMG_NAME }}:${{ env.IMG_TAG }}
      - name: Testing Server Response
        run: |
          sleep 3
          curl -fs http://${{ secrets.SERVER_IP }}:3001
          
        
